# gitleaks configuration: the default rules, with the test keys allowed.
# tests/fixtures/vertex-test-service-account-key.pem is an RSA key made only
# for the Vertex AI service-account test; it belongs to no account and signs
# in to nothing (tests/fixtures/README.md). The tests in tests/spec_vertex.rs
# build their stand-in keys at run time, so no other file needs allowing; the
# two commits below hold those stand-ins as literals and nothing else.
[extend]
useDefault = true

[[allowlists]]
description = "Throwaway key for the Vertex AI service-account test"
paths = ['''^tests/fixtures/vertex-test-service-account-key\.pem$''']

[[allowlists]]
description = "Stand-in keys written as literals in tests/spec_vertex.rs before the tests built them"
condition = "AND"
commits = [
  "0eeef8fc73c0bc9ef02e8c08d361010130df0e91",
  "1bb3e43b7070303002f6d1e2847e9b60cbe0ae1a",
]
paths = ['''^tests/spec_vertex\.rs$''']
