# gitleaks configuration: the default rules, with the test keys allowed.
# tests/fixtures/vertex-test-service-account-key.pem is an RSA key made only
# for the Vertex AI service-account test; it belongs to no account and signs
# in to nothing (tests/fixtures/README.md). tests/spec_vertex.rs also holds
# stand-in keys whose body is base64 for "secret".
[extend]
useDefault = true

[[allowlists]]
description = "Throwaway key for the Vertex AI service-account test"
paths = ['''^tests/fixtures/vertex-test-service-account-key\.pem$''']

[[allowlists]]
description = "Stand-in keys in the Vertex AI tests, base64 for secret"
regexTarget = "match"
regexes = ['''-----BEGIN PRIVATE KEY-----\\nc2VjcmV0''']
