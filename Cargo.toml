[package]
name = "suprnova-ai"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Inference core for the AI SDK Rust port"
license = "Apache-2.0"
repository = "https://github.com/eas4ai/suprnova-ai-rs"

[features]
default = []
reqwest = ["dep:reqwest"]
# A scripted provider for tests that run without a network (`suprnova_ai::testing`).
testing = []
# A WebSocket transport over tokio-tungstenite with rustls, for live and
# realtime sessions (`suprnova_ai::transport::TungsteniteTransport`).
websocket = ["dep:tokio-tungstenite", "dep:rustls", "dep:webpki-roots"]

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
bigdecimal = "0.4.11"
bytes = "1.10.1"
cookie_store = { version = "0.22.0", default-features = false }
futures = "0.3.31"
mime_guess = "2.0.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["float_roundtrip", "preserve_order"] }
schemars = "1.0.4"
thiserror = "2.0.17"
url = "2.5.7"
tokio = { version = "1.48.0", features = ["sync", "rt", "macros", "time", "net"] }
reqwest = { version = "0.12.24", optional = true, default-features = false, features = ["rustls-tls", "stream", "gzip", "deflate", "brotli", "zstd"] }
httpdate = "1.0.3"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1.0.10", optional = true }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["rt-multi-thread", "net", "io-util", "test-util"] }

[[test]]
name = "spec_models"
required-features = ["testing"]

[[test]]
name = "spec_agents"
required-features = ["testing"]
